[build-system]
requires = [
    "setuptools>=40.8.0",
    "wheel",
    "torch>=1.9.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "grid_torch"
version = "0.1.0"
description = "GRiD PyTorch CUDA extensions"
requires-python = ">=3.7"
dependencies = [
    "torch>=1.9.0",
    "numpy>=1.19.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["grid_torch*"]